# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
---
on:
  push:
    branches: [main, master]
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/pkgdown.yaml'

  pull_request:
    branches: [main, master]
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/pkgdown.yaml'

  release:
    types: [published]

  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # The rattler examples of the backends article run only when
      # rattlerthis is installed. It builds from source with the Rust
      # toolchain of the runner. `R CMD INSTALL` keeps the local condathis:
      # pak would follow the `Remotes` field of rattlerthis to condathis's
      # main branch instead. A failed build leaves those examples without
      # output and does not stop the site.
      - name: Install rattlerthis for the backends article
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          git clone --depth 1 https://github.com/luciorq/rattlerthis "$RUNNER_TEMP/rattlerthis"
          R CMD INSTALL "$RUNNER_TEMP/rattlerthis"

      # pkgdown renders every Markdown file at the top of the repository and
      # of .github/; these are development notes, not documentation.
      - name: Leave development notes out of the site
        run: rm -f PLAN.md TODO.md .github/AGENTS.md

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
